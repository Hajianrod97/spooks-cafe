<!doctype html>
<meta charset="utf-8">
<title>Cafe preview</title>
<!-- Mirrors src/cafe/cafe.css: a 960-wide stage centred in a scene that crops it. -->
<style>
  body { margin: 0; padding: 16px; background: #1d1b36; display: flex; flex-direction: column; gap: 16px; align-items: flex-start; }
  .scene { position: relative; height: 340px; overflow: hidden; border-radius: 12px; }
  .stage { position: absolute; left: 50%; top: 0; width: 960px; height: 340px; margin-left: -480px; }
  .stage img, .tint { position: absolute; left: 0; top: 0; width: 960px; height: 340px; }
  .stage img.spook { left: 405px; top: 98px; width: 150px; height: 157px; }
  .tint { -webkit-mask-size: 960px 340px; mask-size: 960px 340px; }
  .morning .tint { background: rgba(255, 200, 140, .14); mix-blend-mode: soft-light; }
  .evening .tint { background: rgba(240, 110, 100, .22); mix-blend-mode: multiply; }
  .night .tint { background: rgba(52, 46, 120, .5); mix-blend-mode: multiply; }
</style>
<script>
  // scene: "room" (the counter) or "tables"; sky files are sky-<time> / tables-sky-<time>.
  const A = "../../src/assets";
  function scene(place, time, pose, width) {
    const sky = place === "room" ? `sky-${time}` : `tables-sky-${time}`;
    const mask = (layer) => `-webkit-mask-image:url(${A}/cafe/${place}-${layer}.svg);mask-image:url(${A}/cafe/${place}-${layer}.svg)`;
    document.write(`<div class="scene ${time}" style="width:${width}px"><div class="stage">
      <img src="${A}/cafe/${sky}.svg"><img src="${A}/cafe/${place}-back.svg"><div class="tint" style="${mask("back")}"></div>
      <img class="spook" src="${A}/spook/spook-${pose}.svg"><img src="${A}/cafe/${place}-front.svg"><div class="tint" style="${mask("front")}"></div>
    </div></div>`);
  }
  scene("room", "night", "focus", 960);
  scene("tables", "night", "break", 960);
  scene("tables", "afternoon", "idle", 480);
</script>
